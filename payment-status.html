<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Payment status for Buy Me a Coffee support.">
    <title>Payment Status | Avijit Biswas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #f5f8ff;
        --card: rgba(255,255,255,.9);
        --primary: #4263e8;
        --primary-dark: #2f4fc7;
        --success: #1faa6f;
        --danger: #d94c5c;
        --text: #1d2c48;
        --muted: #5d6c87;
        --border: rgba(111,137,190,.2);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at 10% 0%, rgba(91,124,250,.14), transparent 26rem), radial-gradient(circle at 90% 80%, rgba(42,199,201,.14), transparent 25rem), var(--bg);
        color: var(--text);
      }
      .status-card {
        width: min(100%, 620px);
        padding: clamp(1.5rem, 3vw, 3rem);
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 22px 64px rgba(67,92,151,.12);
      }
      .status-icon {
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 24px;
        font-size: 2.5rem;
        color: #fff;
      }
      .status-success .status-icon {
        background: linear-gradient(135deg, #1faa6f, #4dd89d);
      }
      .status-failure .status-icon {
        background: linear-gradient(135deg, #d94c5c, #ef7a8b);
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(2.1rem, 4vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        margin-bottom: .6rem;
      }
      .status-text {
        color: var(--muted);
        margin: 0 auto 1.5rem;
        max-width: 470px;
        line-height: 1.7;
      }
      .detail-box {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f8faff;
        padding: 1rem 1.2rem;
        text-align: left;
        margin: 1.25rem 0 1.5rem;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: .45rem 0;
        font-size: .96rem;
      }
      .detail-row + .detail-row {
        border-top: 1px solid rgba(111,137,190,.15);
      }
      .detail-row span:first-child {
        color: var(--muted);
      }
      .detail-row strong {
        color: var(--text);
      }
      .action-row {
        display: flex;
        justify-content: center;
        gap: .85rem;
        flex-wrap: wrap;
      }
      .btn-primary,
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: .8rem 1.4rem;
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
        transition: transform .2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        border: none;
      }
      .btn-outline {
        background: transparent;
        color: var(--primary);
        border: 1px solid rgba(66,99,232,.25);
      }
      .btn-primary:hover,
      .btn-outline:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon"><i id="statusEmoji" class="bi"></i></div>
      <h1 id="statusTitle">Payment Status</h1>
      <p class="status-text" id="statusText">Please wait while we check your transaction.</p>

      <div class="detail-box" id="detailBox">
        <div class="detail-row"><span>Transaction ID</span><strong id="txnValue">-</strong></div>
        <div class="detail-row"><span>Amount</span><strong id="amountValue">-</strong></div>
        <div class="detail-row"><span>Name</span><strong id="nameValue">-</strong></div>
        <div class="detail-row"><span>Service ID</span><strong id="serviceIdValue">-</strong></div>
        <div class="detail-row"><span>Message</span><strong id="messageValue">-</strong></div>
      </div>

      <div class="action-row">
        <a href="buy_a_coffy.html" class="btn-outline">Try Again</a>
        <a href="index.html" class="btn-primary">Back to Home</a>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const status = params.get('status') || 'failure';
      const txnId = params.get('txn') || 'N/A';
      const amount = params.get('amount') || 'N/A';
      const name = params.get('name') || 'Not provided';
      const email = params.get('email') || 'Not provided';
      const serviceId = params.get('serviceId') || 'Not provided';
      const message = params.get('message') || 'No message provided';
      const failureReason = params.get('reason') || 'Your payment could not be processed. Please check your payment details and try again.';

      const statusCard = document.getElementById('statusCard');
      const statusTitle = document.getElementById('statusTitle');
      const statusText = document.getElementById('statusText');
      const statusEmoji = document.getElementById('statusEmoji');
      const txnValue = document.getElementById('txnValue');
      const amountValue = document.getElementById('amountValue');
      const nameValue = document.getElementById('nameValue');
      const serviceIdValue = document.getElementById('serviceIdValue');
      const messageValue = document.getElementById('messageValue');

      if (status === 'success') {
        statusCard.classList.add('status-success');
        statusEmoji.classList.add('bi-check-circle-fill');
        statusTitle.textContent = 'Payment Successful';
        statusText.textContent = 'Thank you for your support. Your transaction was processed successfully.';
        txnValue.textContent = txnId;
        amountValue.textContent = amount;
        nameValue.textContent = name + ' (' + email + ')';
        serviceIdValue.textContent = serviceId;
        messageValue.textContent = message;
      } else {
        statusCard.classList.add('status-failure');
        statusEmoji.classList.add('bi-x-circle-fill');
        statusTitle.textContent = 'Payment Failed';
        statusText.textContent = failureReason;
        txnValue.textContent = 'Unavailable';
        amountValue.textContent = amount === 'N/A' ? 'N/A' : amount;
        nameValue.textContent = name;
        serviceIdValue.textContent = serviceId;
        messageValue.textContent = message;
      }
    </script>
  </body>
</html>
