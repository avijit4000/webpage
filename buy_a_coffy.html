<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Support Avijit Biswas with a coffee.">
    <title>Buy Me a Coffee | Avijit Biswas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      .coffee-page { min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 10% 0%, rgba(91,124,250,.14), transparent 32rem), radial-gradient(circle at 92% 80%, rgba(42,199,201,.14), transparent 28rem), #f7faff; }
      .coffee-main { flex: 1; display: grid; place-items: center; padding: 4rem 1rem; }
      .coffee-card { width: min(100%, 640px); padding: clamp(2rem, 6vw, 4rem); text-align: center; background: rgba(255,255,255,.88); border: 1px solid rgba(111,137,190,.16); border-radius: 28px; box-shadow: 0 22px 64px rgba(67,92,151,.12); }
      .coffee-icon { width: 92px; height: 92px; display: grid; place-items: center; margin: 0 auto 1.6rem; border-radius: 24px; color: #fff; font-size: 2.7rem; background: linear-gradient(135deg, #5b7cfa, #2ac7c9); box-shadow: 0 15px 32px rgba(91,124,250,.27); }
      .coffee-card h1 { color: #182b55; font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -.04em; }
      .coffee-card p { max-width: 470px; margin: 1rem auto 2rem; color: #6b7a92; }
      .amounts { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      .amount { border: 1px solid rgba(91,124,250,.22); color: #4263e8; background: #fff; border-radius: 10px; padding: .65rem 1rem; font-weight: 700; cursor: pointer; }
      .amount:hover, .amount.active { color: #fff; background: #5b7cfa; border-color: #5b7cfa; }
      .pay-button { display: inline-flex; align-items: center; gap: .55rem; padding: .85rem 1.5rem; border: 0; border-radius: 10px; color: #fff; background: #4263e8; font-weight: 700; box-shadow: 0 10px 22px rgba(66,99,232,.25); cursor: pointer; }
      .pay-button:hover { background: #3655d2; transform: translateY(-1px); }
      .payment-note { min-height: 1.5rem; margin: 1.25rem 0 0; font-size: .9rem; color: #6b7a92; }
    </style>
  </head>
  <body class="coffee-page">
    <header class="site-header">
      <div class="container-lg">
        <nav class="navbar px-0">
          <a class="navbar-brand" href="index.html#home"><span class="brand-mark">AB</span><span class="brand-text">Avijit Biswas</span></a>
          <a href="index.html" class="btn btn-outline-primary btn-sm nav-cta"><i class="bi bi-arrow-left me-1"></i>Back to site</a>
        </nav>
      </div>
    </header>
    <main class="coffee-main">
      <section class="coffee-card" aria-labelledby="coffee-title">
        <div class="coffee-icon" aria-hidden="true"><i class="bi bi-cup-hot-fill"></i></div>
        <h1 id="coffee-title">Buy Me a Coffee</h1>
        <p>If my work has helped you, a small coffee is a lovely way to support more ideas, experiments, and open-source projects.</p>
        <div class="amounts" aria-label="Choose a contribution amount">
          <button class="amount active" type="button" data-amount="₹99">₹99</button>
          <button class="amount" type="button" data-amount="₹199">₹199</button>
          <button class="amount" type="button" data-amount="₹499">₹499</button>
        </div>
        <button class="pay-button" id="payButton" type="button"><i class="bi bi-heart-fill"></i>Pay ₹99</button>
        <p class="payment-note" id="paymentNote" aria-live="polite"></p>
      </section>
    </main>
    <footer class="footer">
      <div class="container-lg"><div class="footer-inner"><p>&copy; 2026 Avijit Biswas. All rights reserved.</p><div class="footer-links"><a href="index.html#contact">Contact</a></div></div></div>
    </footer>
    <script>
      const amounts = document.querySelectorAll('.amount');
      const payButton = document.getElementById('payButton');
      const paymentNote = document.getElementById('paymentNote');
      let selectedAmount = '₹99';
      amounts.forEach(button => button.addEventListener('click', () => {
        amounts.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        selectedAmount = button.dataset.amount;
        payButton.innerHTML = '<i class="bi bi-heart-fill"></i>Pay ' + selectedAmount;
        paymentNote.textContent = '';
      }));
      payButton.addEventListener('click', () => {
        paymentNote.textContent = 'Thank you! A payment provider link can be added here when it is ready.';
      });
    </script>
  </body>
</html>
